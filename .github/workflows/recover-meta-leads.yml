name: Recuperar leads da Meta

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: recover-meta-leads
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Buscar leads ausentes no CRM Master
        env:
          CRM_CRON_SECRET: ${{ secrets.CRM_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 240 \
            --retry 2 \
            --retry-delay 10 \
            -H "Authorization: Bearer ${CRM_CRON_SECRET}" \
            https://crm.mastereducapro.com.br/api/cron/meta-leads
