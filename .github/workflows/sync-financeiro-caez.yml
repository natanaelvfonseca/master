name: Sincronizar financeiro CAEZ

on:
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-financeiro-caez
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Processar lotes pendentes do financeiro
        env:
          CRM_CRON_SECRET: ${{ secrets.CRM_CRON_SECRET }}
        run: |
          if [ -z "$CRM_CRON_SECRET" ]; then
            echo "CRM_CRON_SECRET não configurado no GitHub Actions."
            exit 1
          fi

          for batch in $(seq 1 200); do
            if [ "$SECONDS" -ge 1080 ]; then
              echo "Limite de tempo atingido; a próxima execução continuará."
              break
            fi

            response=$(curl --fail-with-body --silent --show-error \
              --max-time 240 \
              -H "Authorization: Bearer ${CRM_CRON_SECRET}" \
              https://crm.mastereducapro.com.br/api/cron/financeiro-caez-sync)

            if ! jq -e '.ok == true' <<< "$response" >/dev/null; then
              echo "Resposta inválida do cron financeiro."
              exit 1
            fi

            if [ "$(jq -r '.result.processed // false' <<< "$response")" != "true" ]; then
              echo "Nenhuma sincronização pendente."
              break
            fi

            if [ "$(jq -r '.result.status // empty' <<< "$response")" = "failed" ]; then
              echo "Lote financeiro falhou; consulte o status no CRM."
              exit 1
            fi

            echo "Lote $batch concluído."
            if [ "$(jq -r '.result.completed // false' <<< "$response")" = "true" ]; then
              echo "Sincronização concluída."
              break
            fi
            sleep 2
          done
